services:
  taskrelay:
    image: ${TASKRELAY_IMAGE:-ghcr.io/stratmannbenedikt/taskrelaymcp:latest}
    restart: unless-stopped
    environment:
      TASKRELAY_ADMIN_USERNAME: ${TASKRELAY_ADMIN_USERNAME:?Set TASKRELAY_ADMIN_USERNAME}
      TASKRELAY_ADMIN_PASSWORD: ${TASKRELAY_ADMIN_PASSWORD:?Set TASKRELAY_ADMIN_PASSWORD}
      TASKRELAY_ADMIN_DISPLAY_NAME: ${TASKRELAY_ADMIN_DISPLAY_NAME:-Administrator}
      TASKRELAY_SECURE_COOKIES: ${TASKRELAY_SECURE_COOKIES:-true}
      TASKRELAY_PUBLIC_ORIGIN: ${TASKRELAY_PUBLIC_ORIGIN:?Set TASKRELAY_PUBLIC_ORIGIN}
    volumes:
      - taskrelay-data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  taskrelay-data:
