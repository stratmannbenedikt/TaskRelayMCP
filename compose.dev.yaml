services:
  taskrelay:
    build: .
    environment:
      TASKRELAY_ADMIN_USERNAME: admin
      TASKRELAY_ADMIN_PASSWORD: taskrelay-local-password
      TASKRELAY_ADMIN_DISPLAY_NAME: Local Administrator
      TASKRELAY_SECURE_COOKIES: "false"
      TASKRELAY_PUBLIC_ORIGIN: http://localhost:8080
    volumes:
      - taskrelay-dev-data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  taskrelay-dev-data:
